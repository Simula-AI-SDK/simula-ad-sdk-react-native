name: CI

# SimulaAdSDK 1.1.7 is still on its native PR branch. Keep this checkout aligned
# until that PR is merged and 1.1.7 is published; native must merge/release first,
# then this can move back to `dev` before the RN PR merges. A repository variable
# allows maintainers to advance the ref without editing this workflow.
# The Kotlin 1.1.6 source check follows the same ordering: merge/publish the native
# SDK first, then point SIMULA_KOTLIN_SDK_REF back to `dev` before merging RN.

on:
  pull_request:
  push:
    branches: [dev]

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test -- --runInBand

  ios-pod:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout native Swift SDK source
        uses: actions/checkout@v4
        with:
          repository: Simula-AI-SDK/simula-ad-sdk-swift
          ref: ${{ vars.SIMULA_SWIFT_SDK_REF || 'cesar/moreImprovements' }}
          path: simula-ad-sdk-swift
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compile the RN iOS pod in a real React Native workspace
        env:
          SWIFT_SDK_PATH: ${{ github.workspace }}/simula-ad-sdk-swift
        run: bash scripts/verify-ios-pod.sh

  android-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout native Kotlin SDK source
        uses: actions/checkout@v4
        with:
          repository: Simula-AI-SDK/simula-ad-sdk-kotlin
          ref: ${{ vars.SIMULA_KOTLIN_SDK_REF || 'cesar/moreImprovements' }}
          path: simula-ad-sdk-kotlin
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Compile the RN Android bridge against the native SDK
        env:
          KOTLIN_SDK_PATH: ${{ github.workspace }}/simula-ad-sdk-kotlin
        run: bash scripts/verify-android-bridge.sh
