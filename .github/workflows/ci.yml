name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  javascript:
    name: TypeScript and Jest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test -- --ci --runInBand

  android:
    name: Android native bridge
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 9.0.0
      - run: npm ci
      - run: gradle -p native-test/android :simula-ads-react-native:compileDebugKotlin

  ios:
    name: iOS native bridge
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: pod install --repo-update --project-directory=native-test/ios
        env:
          RCT_USE_PREBUILT_RNCORE: 1
          RCT_USE_RN_DEP: 1
      - run: >-
          xcodebuild build
          -project native-test/ios/Pods/Pods.xcodeproj
          -scheme simula-ads-react-native
          -destination "generic/platform=iOS Simulator"
          CODE_SIGNING_ALLOWED=NO
          ARCHS=arm64
          ONLY_ACTIVE_ARCH=YES
        env:
          REACT_NATIVE_PATH: ${{ github.workspace }}/node_modules/react-native
