name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (for example, 1.4.0 or 1.4.0-dev.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      npm_tag: ${{ steps.release_metadata.outputs.npm_tag }}
      is_prerelease: ${{ steps.release_metadata.outputs.is_prerelease }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Validate release metadata
        id: release_metadata
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const packageJson = require("./package.json");
          const packageLock = require("./package-lock.json");
          const packageVersion = packageJson.version;
          const lockfileVersion = packageLock.version;
          const lockfilePackageVersion = packageLock.packages?.[""]?.version;
          const podspec = fs.readFileSync("simula-ads-react-native.podspec", "utf8");
          const podspecVersion = podspec.match(/s\.version\s*=\s*"([^"]+)"/)?.[1];
          const stableVersion = /^\d+\.\d+\.\d+$/;
          const devVersion = /^\d+\.\d+\.\d+-dev\.\d+$/;

          if (process.env.RELEASE_VERSION !== packageVersion) {
            throw new Error(`Requested version ${process.env.RELEASE_VERSION} does not match package version ${packageVersion}`);
          }
          if (lockfileVersion !== packageVersion || lockfilePackageVersion !== packageVersion) {
            throw new Error(`Package lock versions ${lockfileVersion}/${lockfilePackageVersion} do not match package version ${packageVersion}`);
          }
          if (podspecVersion !== packageVersion) {
            throw new Error(`Podspec version ${podspecVersion ?? "missing"} does not match package version ${packageVersion}`);
          }
          if (!stableVersion.test(packageVersion) && !devVersion.test(packageVersion)) {
            throw new Error(`Version ${packageVersion} must be stable (x.y.z) or a dev prerelease (x.y.z-dev.N)`);
          }

          const isPrerelease = devVersion.test(packageVersion);
          const npmTag = isPrerelease ? "dev" : "latest";
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `npm_tag=${npmTag}\nis_prerelease=${isPrerelease}\n`,
          );
          console.log(`Release channel: npm tag ${npmTag}, prerelease ${isPrerelease}`);
          NODE

      - name: Verify native SDK versions exist
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const gradle = fs.readFileSync("android/build.gradle", "utf8");
          const podspec = fs.readFileSync("simula-ads-react-native.podspec", "utf8");
          const androidVersion = gradle.match(/implementation\s+["']ad\.simula:ad-sdk:([^"']+)["']/)?.[1];
          const iosVersion = podspec.match(/s\.dependency\s+["']SimulaAdSDK["']\s*,\s*["']([^"']+)["']/)?.[1];

          if (!androidVersion) {
            throw new Error("Could not find the Android ad.simula:ad-sdk dependency version");
          }
          if (!iosVersion) {
            throw new Error("Could not find the iOS SimulaAdSDK dependency version");
          }

          async function fetchWithRetry(url, options = {}) {
            let lastError;
            for (let attempt = 1; attempt <= 3; attempt += 1) {
              try {
                const response = await fetch(url, {
                  ...options,
                  signal: AbortSignal.timeout(15_000),
                });
                if (response.status >= 500 && attempt < 3) {
                  await new Promise((resolve) => setTimeout(resolve, attempt * 1_000));
                  continue;
                }
                return response;
              } catch (error) {
                lastError = error;
                if (attempt < 3) {
                  await new Promise((resolve) => setTimeout(resolve, attempt * 1_000));
                }
              }
            }
            throw lastError;
          }

          const mavenUrl = `https://repo1.maven.org/maven2/ad/simula/ad-sdk/${encodeURIComponent(androidVersion)}/ad-sdk-${encodeURIComponent(androidVersion)}.pom`;
          const mavenResponse = await fetchWithRetry(mavenUrl);
          if (!mavenResponse.ok) {
            throw new Error(`Android SDK ${androidVersion} was not found on Maven Central (${mavenResponse.status})`);
          }

          const cocoaPodsResponse = await fetchWithRetry("https://trunk.cocoapods.org/api/v1/pods/SimulaAdSDK");
          if (!cocoaPodsResponse.ok) {
            throw new Error(`Could not query CocoaPods for SimulaAdSDK (${cocoaPodsResponse.status})`);
          }
          const cocoaPods = await cocoaPodsResponse.json();
          if (!cocoaPods.versions?.some(({ name }) => name === iosVersion)) {
            throw new Error(`iOS SDK ${iosVersion} was not found on CocoaPods`);
          }

          console.log(`Verified Android SDK ${androidVersion} and iOS SDK ${iosVersion}`);
          NODE

      - name: Verify version has not been released
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const packageJson = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const version = process.env.RELEASE_VERSION;
          const repository = process.env.GITHUB_REPOSITORY;
          const githubHeaders = {
            Accept: "application/vnd.github+json",
            Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
            "X-GitHub-Api-Version": "2022-11-28",
          };

          async function expectMissing(label, url, options = {}) {
            const response = await fetch(url, {
              ...options,
              signal: AbortSignal.timeout(15_000),
            });
            if (response.ok) {
              throw new Error(`${label} already exists`);
            }
            if (response.status !== 404) {
              throw new Error(`Could not check ${label} (${response.status})`);
            }
          }

          const encodedPackage = encodeURIComponent(packageJson.name);
          await expectMissing(
            `npm package ${packageJson.name}@${version}`,
            `https://registry.npmjs.org/${encodedPackage}/${encodeURIComponent(version)}`,
          );
          await expectMissing(
            `Git tag ${version}`,
            `https://api.github.com/repos/${repository}/git/ref/tags/${encodeURIComponent(version)}`,
            { headers: githubHeaders },
          );
          await expectMissing(
            `GitHub release ${version}`,
            `https://api.github.com/repos/${repository}/releases/tags/${encodeURIComponent(version)}`,
            { headers: githubHeaders },
          );
          NODE

      - name: Run tests
        run: npm test -- --ci --runInBand

      - name: Build package
        run: npm run build

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Create release package
        run: npm pack

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: "*.tgz"
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download release package
        uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: release-package

      - name: Publish package with trusted publishing
        run: npm publish ./release-package/*.tgz --access public --tag "${{ needs.verify.outputs.npm_tag }}"

  release:
    name: Create GitHub release
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download release package
        uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: release-package

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          IS_PRERELEASE: ${{ needs.verify.outputs.is_prerelease }}
        run: |
          release_args=(
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "$RELEASE_VERSION"
            --generate-notes
          )
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$RELEASE_VERSION" ./release-package/*.tgz "${release_args[@]}"
