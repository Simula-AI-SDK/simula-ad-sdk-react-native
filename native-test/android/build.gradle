buildscript {
    ext {
        kotlinVersion = "2.1.20"
        jvmTarget = 17
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.12.0"
        classpath "com.facebook.react:react-native-gradle-plugin"
    }
}

project(":simula-ads-react-native") {
    plugins.withId("com.facebook.react") {
        def reactExtension = extensions.getByName("react")
        reactExtension.root.set(rootProject.file("../.."))
        reactExtension.reactNativeDir.set(rootProject.file("../../node_modules/react-native"))
        reactExtension.codegenDir.set(rootProject.file("../../node_modules/@react-native/codegen"))
        reactExtension.jsRootDir.set(rootProject.file("../../src"))

        def privateReactExtension = rootProject.extensions.getByName("privateReact")
        privateReactExtension.root.set(rootProject.file("../.."))
        privateReactExtension.reactNativeDir.set(rootProject.file("../../node_modules/react-native"))
        privateReactExtension.codegenDir.set(rootProject.file("../../node_modules/@react-native/codegen"))
    }
}
